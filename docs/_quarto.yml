format:
  html:
    brand: _brand.yml
    theme:
      light:
        - cosmo
        - theme-light.scss
      dark:
        - darkly
        - theme-dark.scss
    css:
      - styles.css
      - components/learning-shell.css
      - components/landing.css
      - components/catalog-faq.css
      - components/course-portfolio.css
      - components/responsive.css
    template-partials:
      - _partials/title-block.html
    include-after-body:
      - _includes/course-ui.html
    toc: true
    toc-title: On this page
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: true
    link-external-newwindow: true
execute:
  freeze: auto
  eval: false
