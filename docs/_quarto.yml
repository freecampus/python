project:
  type: website
  output-dir: _site

website:
  title: FreeCampus Python
  description: A beginner-first Python course from zero programming experience to practical projects.
  site-url: https://freecampus.github.io/python/
  repo-url: https://github.com/freecampus/python
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  bread-crumbs: false
  navbar:
    logo: assets/freecampus-mark.svg
    logo-alt: FreeCampus Python
    search: true
    collapse-below: lg
