schema_version: 1
curriculum_version: 17
course_id: python-foundations
graduate_outcomes:
  learn-independently: Use prediction, clean execution, documentation, deliberate practice, and responsible AI assistance to learn from evidence.
  trace-and-explain: Trace Python execution and explain values, state, control flow, calls, object relationships, and failures.
  model-data: Choose and transform scalar values, collections, text, time, objects, and persistent data safely.
  design-abstractions: Design functions, modules, packages, and objects with explicit contracts and cohesive responsibilities.
  solve-problems: Turn requirements and examples into small algorithms whose boundaries and practical costs can be explained.
  debug-from-evidence: Reduce failures and test one hypothesis at a time using tracebacks, tools, reproductions, and controlled experiments.
  handle-boundaries: Validate external input, manage resources, handle anticipated errors, and preserve useful context.
  build-projects: Organize, version, configure, install, package, and operate a reproducible Python project.
  verify-quality: Use assertions, pytest, property checks, typing, formatting, linting, and quality gates to protect behavior.
  communicate: Explain software through useful names, contracts, READMEs, API documentation, executable examples, and published sites.
units:
  - number: 0
    id: get-started
    outcome: Choose a dependable learning environment and use prediction, execution, explanation, modification, debugging, and responsible AI assistance as a repeatable learning loop.
    graduate_outcome_ids:
      - learn-independently
      - trace-and-explain
    lesson_ids:
      - get-started.programming-python-ai
      - get-started.learning-loop-ai
      - get-started.notebooks-literate-workflows
      - get-started.local-python-environment
    challenge_id: get-started.challenge
  - number: 1
    id: python-syntax
    outcome: Read a short Python program from top to bottom, identify the role of its words and symbols, trace names and expressions, recognize blocks and continued lines, document decisions, and repair syntax errors systematically.
    graduate_outcome_ids:
      - trace-and-explain
      - learn-independently
    lesson_ids:
      - python-syntax.values-names-assignment
      - python-syntax.expressions-statements-execution-order
      - python-syntax.python-words-symbols
      - python-syntax.indentation-code-blocks
      - python-syntax.writing-code-across-lines
      - python-syntax.comments-docstrings
      - python-syntax.reading-fixing-syntax-errors
    challenge_id: python-syntax.challenge
  - number: 2
    id: core-values-types
    outcome: Choose suitable Python values for counts, measurements, money, text, truth, missing information, and time; convert and format them deliberately; and explain important precision, parsing, and comparison boundaries.
    graduate_outcome_ids:
      - trace-and-explain
      - model-data
    lesson_ids:
      - core-values-types.values-types-none-conversion
      - core-values-types.integer-arithmetic
      - core-values-types.floating-point-precision
      - core-values-types.money-ratios-complex-numbers
      - core-values-types.strings-unicode-text
      - core-values-types.input-output-formatting
      - core-values-types.booleans-comparisons-truth
      - core-values-types.dates-times-durations
    challenge_id: core-values-types.challenge
  - number: 3
    id: collections-iteration
    outcome: Choose among lists, tuples, dictionaries, and sets from the required order, mutability, lookup, uniqueness, and data shape; traverse them safely; and sort or combine them without losing relationships between values.
    graduate_outcome_ids:
      - model-data
      - trace-and-explain
    lesson_ids:
      - collections-iteration.lists
      - collections-iteration.tuples-unpacking
      - collections-iteration.dictionaries
      - collections-iteration.sets-frozensets
      - collections-iteration.traversing-collections
      - collections-iteration.sorting-collections
      - collections-iteration.nested-data-collection-choice
    challenge_id: collections-iteration.challenge
  - number: 4
    id: decisions-repetition
    outcome: Turn written rules into complete, non-overlapping branches; use for and while loops to transform, filter, count, group, search, and traverse nested data; and explain how each loop progresses and stops without losing or skipping values.
    graduate_outcome_ids:
      - trace-and-explain
      - solve-problems
    lesson_ids:
      - decisions-repetition.conditional-branches
      - decisions-repetition.boolean-rules-short-circuit
      - decisions-repetition.decision-tables-boundaries
      - decisions-repetition.for-loop-patterns
      - decisions-repetition.while-loops-termination
      - decisions-repetition.search-loop-control
      - decisions-repetition.nested-loops-grids
      - decisions-repetition.comprehensions
    challenge_id: decisions-repetition.challenge
  - number: 5
    id: functions-call-behavior
    outcome: Design, call, compose, and trace reusable functions with clear parameters, returned results, documented contracts, and controlled side effects; pass behavior as data; and explain how recursive, lazy, closure-based, and decorated calls progress and finish.
    graduate_outcome_ids:
      - design-abstractions
      - trace-and-explain
    lesson_ids:
      - functions-call-behavior.defining-calling-returning
      - functions-call-behavior.parameters-stable-interfaces
      - functions-call-behavior.contracts-decomposition-side-effects
      - functions-call-behavior.scope-name-resolution-call-stack
      - functions-call-behavior.functions-values-callbacks
      - functions-call-behavior.recursion-recursive-tracing
      - functions-call-behavior.iterators-generators-lazy-values
      - functions-call-behavior.decorators-function-contracts
    challenge_id: functions-call-behavior.challenge
  - number: 6
    id: mutability-identity-copying
    outcome: Trace which names and containers share objects; distinguish equality, identity, rebinding, mutation, immutability, and hashability; choose shallow, selective, or deep copying from an explicit ownership contract; and design functions whose mutations or returned copies are deliberate and observable.
    graduate_outcome_ids:
      - model-data
      - debug-from-evidence
    lesson_ids:
      - mutability-identity-copying.equality-identity-references
      - mutability-identity-copying.mutable-immutable-hashable
      - mutability-identity-copying.aliasing-shallow-deep-copies
      - mutability-identity-copying.mutation-function-boundaries
    challenge_id: mutability-identity-copying.challenge
  - number: 7
    id: problem-solving-algorithms
    outcome: Turn an unclear task into explicit examples and rules; decompose it into checkable functions; select, trace, and adapt common algorithms; and defend correctness, boundary behavior, and practical time and memory costs.
    graduate_outcome_ids:
      - solve-problems
      - verify-quality
    lesson_ids:
      - problem-solving-algorithms.problems-examples-acceptance
      - problem-solving-algorithms.decomposition-pseudocode-implementation
      - problem-solving-algorithms.core-algorithm-patterns
      - problem-solving-algorithms.correctness-boundaries-efficiency
    challenge_id: problem-solving-algorithms.challenge
  - number: 8
    id: errors-exceptions-debugging
    outcome: Classify syntax failures, runtime exceptions, and wrong results; read tracebacks across function calls; raise and handle only anticipated exceptions with useful context; and reproduce, inspect, isolate, repair, and verify a bug one evidence-backed hypothesis at a time.
    graduate_outcome_ids:
      - debug-from-evidence
      - handle-boundaries
    lesson_ids:
      - errors-exceptions-debugging.failure-categories-tracebacks
      - errors-exceptions-debugging.raising-handling-exceptions
      - errors-exceptions-debugging.repeatable-debugging-method
      - errors-exceptions-debugging.debugger-minimal-reproductions
    challenge_id: errors-exceptions-debugging.challenge
  - number: 9
    id: files-paths-external-data
    outcome: Locate and traverse files predictably; read and write text with explicit resource, encoding, newline, and replacement policies; translate CSV, JSON, YAML, and binary data into validated Python values; and build a reproducible import pipeline that preserves accepted data, rejected evidence, and original inputs.
    graduate_outcome_ids:
      - model-data
      - handle-boundaries
    lesson_ids:
      - files-paths-external-data.paths-text-files-resources
      - files-paths-external-data.unicode-encodings-newlines
      - files-paths-external-data.csv-json-yaml-records
      - files-paths-external-data.text-patterns-validation-pipelines
      - files-paths-external-data.bytes-binary-memory-streams
    challenge_id: files-paths-external-data.challenge
  - number: 10
    id: modules-environments-projects
    outcome: Find and evaluate reusable Python tools; split behavior across modules and packages with intentional imports and entry points; arrange and version a `src`-layout project; create and diagnose isolated environments; declare metadata and dependencies in `pyproject.toml`; and build, inspect, and clean-install a wheel whose public API works outside the repository.
    graduate_outcome_ids:
      - build-projects
      - design-abstractions
    lesson_ids:
      - modules-environments-projects.builtins-standard-library-help
      - modules-environments-projects.modules-imports-entry-points
      - modules-environments-projects.packages-public-interfaces
      - modules-environments-projects.project-layout-git-essentials
      - modules-environments-projects.virtual-environments-dependencies
      - modules-environments-projects.pyproject-builds-tools
    challenge_id: modules-environments-projects.challenge
  - number: 11
    id: object-oriented-python
    outcome: Choose between functions, collections, dataclasses, and stateful classes; build objects that preserve valid state; explain instance attributes and bound methods; compose replaceable collaborators; and use inheritance only when a subtype can honor the same behavioral contract.
    graduate_outcome_ids:
      - design-abstractions
      - model-data
    lesson_ids:
      - object-oriented-python.objects-classes-instances-self
      - object-oriented-python.initialization-invariants-properties
      - object-oriented-python.dataclasses-representation-equality
      - object-oriented-python.composition-inheritance-design
      - object-oriented-python.road-crossing-game-model
    challenge_id: object-oriented-python.challenge
  - number: 12
    id: command-line-applications
    outcome: Design a discoverable command, keep data and diagnostics in their proper channels, resolve settings safely, and connect a thin CLI adapter to reusable Python that can be checked directly and as a real process.
    graduate_outcome_ids:
      - build-projects
      - handle-boundaries
    lesson_ids:
      - command-line-applications.argparse-command-design
      - command-line-applications.streams-errors-exit-codes
      - command-line-applications.configuration-precedence-secrets
      - command-line-applications.logging-useful-diagnostics
      - command-line-applications.cli-ecosystem-testable-architecture
    challenge_id: command-line-applications.challenge
  - number: 13
    id: testing-python-programs
    outcome: Design fast, meaningful tests at appropriate boundaries and use failures to improve behavior without coupling tests to implementation trivia.
    graduate_outcome_ids:
      - verify-quality
      - debug-from-evidence
    lesson_ids:
      - testing-python-programs.what-tests-prove
      - testing-python-programs.pytest-discovery-failures
      - testing-python-programs.fixtures-parametrization-boundaries
      - testing-python-programs.test-doubles-dependency-injection
      - testing-python-programs.test-levels
      - testing-python-programs.properties-regressions-tdd
    challenge_id: testing-python-programs.challenge
  - number: 14
    id: code-quality-maintainability
    outcome: Make behavior-preserving improvements using readable conventions, types, automated checks, and evidence rather than taste alone.
    graduate_outcome_ids:
      - verify-quality
      - communicate
    lesson_ids:
      - code-quality-maintainability.readable-python-pep8
      - code-quality-maintainability.type-annotations-static-checking
      - code-quality-maintainability.formatting-linting-configuration
      - code-quality-maintainability.precommit-quality-gates
      - code-quality-maintainability.evidence-driven-refactoring
    challenge_id: code-quality-maintainability.challenge
  - number: 15
    id: documentation-publishing
    outcome: Create and publish documentation that helps distinct audiences learn, complete tasks, understand design, and use a stable API.
    graduate_outcome_ids:
      - communicate
      - build-projects
    lesson_ids:
      - documentation-publishing.documentation-audiences-readme
      - documentation-publishing.docstrings-api-documentation
      - documentation-publishing.doctest-executable-documentation
      - documentation-publishing.documentation-toolchains-publishing
    challenge_id: documentation-publishing.challenge
