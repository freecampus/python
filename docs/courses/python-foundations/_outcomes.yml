schema_version: 1
curriculum_version: 5
course_id: python-foundations
graduate_outcomes:
  trace-and-explain: Trace Python execution and explain values, state, control flow, calls, and failures.
  decompose-problems: Turn concrete examples and constraints into small algorithms and interfaces.
  model-data: Choose and transform text, sequences, mappings, sets, objects, and persistent data safely.
  design-functions: Design functions with explicit contracts, return values, scope, and independent checks.
  debug-from-evidence: Reduce failures and test one hypothesis at a time using reproducible evidence.
  handle-boundaries: Validate external input, handle anticipated errors, and preserve useful context.
  build-reproducibly: Organize, configure, install, and run a Python project from declared metadata.
  collaborate-with-git: Create reviewable Git history and integrate changes through branches and remotes.
  verify-quality: Use pytest, documentation, formatting, linting, and typing to protect behavior.
  operate-reliably: Choose suitable abstractions and operate observable commands, resources, and CI workflows.
units:
  - number: 1
    id: learning-workflow-tools
    outcome:
      Choose a dependable practice environment and use prediction, clean reruns, and evidence to
      learn deliberately.
    graduate_outcome_ids:
      - trace-and-explain
    lesson_ids:
      - learning-workflow-tools.what-is-programming
      - learning-workflow-tools.google-colab
      - learning-workflow-tools.local-python-tools
    challenge_id: learning-workflow-tools.challenge
  - number: 2
    id: numeric-foundations
    outcome: Represent quantities, trace assignments, choose numeric operations, and explain rounding decisions.
    graduate_outcome_ids:
      - trace-and-explain
      - model-data
    lesson_ids:
      - numeric-foundations.values-variables-types
      - numeric-foundations.numeric-computation
    challenge_id: numeric-foundations.challenge
  - number: 3
    id: text-input-output
    outcome:
      Create, transform, validate, encode, and display text without confusing strings with numbers
      or bytes.
    graduate_outcome_ids:
      - model-data
      - handle-boundaries
    lesson_ids:
      - text-input-output.strings-input-output
      - text-input-output.unicode-and-text-boundaries
    challenge_id: text-input-output.challenge
  - number: 4
    id: decisions
    outcome: Translate rules into Boolean expressions and branches whose boundary behavior can be traced.
    graduate_outcome_ids:
      - trace-and-explain
      - decompose-problems
    lesson_ids:
      - decisions.booleans-and-conditionals
      - decisions.boolean-reasoning
    challenge_id: decisions.challenge
  - number: 5
    id: loops-and-state
    outcome: Repeat work safely, trace changing state, and prove that a loop makes progress toward stopping.
    graduate_outcome_ids:
      - trace-and-explain
      - decompose-problems
    lesson_ids:
      - loops-and-state.blocks-and-indentation
      - loops-and-state.loops-and-tracing
    challenge_id: loops-and-state.challenge
  - number: 6
    id: problem-solving-algorithms
    outcome:
      Turn a written problem into examples, pseudocode, small steps, and a correct search, count,
      or transformation.
    graduate_outcome_ids:
      - decompose-problems
      - debug-from-evidence
    lesson_ids:
      - problem-solving-algorithms.specifications-and-examples
      - problem-solving-algorithms.decomposition-and-pseudocode
      - problem-solving-algorithms.search-count-transform
    challenge_id: problem-solving-algorithms.challenge
  - number: 7
    id: sequences
    outcome:
      Model ordered information, choose mutable or immutable sequences, and use indexing and slicing
      safely.
    graduate_outcome_ids:
      - model-data
    lesson_ids:
      - sequences.lists
      - sequences.tuples
    challenge_id: sequences.challenge
  - number: 8
    id: mappings-and-sets
    outcome: Choose dictionaries and sets for lookup, uniqueness, counting, and nested records.
    graduate_outcome_ids:
      - model-data
    lesson_ids:
      - mappings-and-sets.dictionaries
      - mappings-and-sets.sets
      - mappings-and-sets.nested-data
    challenge_id: mappings-and-sets.challenge
  - number: 9
    id: mutability-and-copying
    outcome: Predict aliasing and mutation, copy at the intended depth, and avoid accidental shared state.
    graduate_outcome_ids:
      - model-data
      - debug-from-evidence
    lesson_ids:
      - mutability-and-copying.identity-aliasing-copying
      - mutability-and-copying.mutation-across-boundaries
    challenge_id: mutability-and-copying.challenge
  - number: 10
    id: functions-and-interfaces
    outcome: Design focused functions with explicit inputs, return values, contracts, and independent checks.
    graduate_outcome_ids:
      - design-functions
      - decompose-problems
    lesson_ids:
      - functions-and-interfaces.function-basics
      - functions-and-interfaces.function-contracts
      - functions-and-interfaces.function-decomposition-and-checks
    challenge_id: functions-and-interfaces.challenge
  - number: 11
    id: scope-and-call-stacks
    outcome:
      Trace names across calls, read stack-shaped execution, and use recursion or function values
      deliberately.
    graduate_outcome_ids:
      - design-functions
      - trace-and-explain
    lesson_ids:
      - scope-and-call-stacks.scope-and-call-stacks
      - scope-and-call-stacks.recursion-and-functions-as-values
    challenge_id: scope-and-call-stacks.challenge
  - number: 12
    id: debugging
    outcome:
      Use tracebacks, controlled experiments, tools, and minimal reproductions to investigate failures
      from evidence.
    graduate_outcome_ids:
      - debug-from-evidence
    lesson_ids:
      - debugging.error-messages
      - debugging.debugging-tools
      - debugging.minimal-reproducible-examples
    challenge_id: debugging.challenge
  - number: 13
    id: files-and-paths
    outcome: Read and write files with explicit paths, encodings, resource lifetimes, and failure expectations.
    graduate_outcome_ids:
      - model-data
      - handle-boundaries
    lesson_ids:
      - files-and-paths.paths-and-text-files
      - files-and-paths.text-files-and-encodings
    challenge_id: files-and-paths.challenge
  - number: 14
    id: structured-data-and-patterns
    outcome: Parse structured files and text patterns through a staged, testable validation pipeline.
    graduate_outcome_ids:
      - model-data
      - handle-boundaries
    lesson_ids:
      - structured-data-and-patterns.structured-files
      - structured-data-and-patterns.regular-expressions
      - structured-data-and-patterns.validation-pipelines
    challenge_id: structured-data-and-patterns.challenge
  - number: 15
    id: exceptions-and-validation
    outcome: Validate boundaries, raise useful exceptions, and catch only failures the program can handle.
    graduate_outcome_ids:
      - handle-boundaries
      - debug-from-evidence
    lesson_ids:
      - exceptions-and-validation.exceptions-and-validation
      - exceptions-and-validation.exception-design
    challenge_id: exceptions-and-validation.challenge
  - number: 16
    id: modules-and-standard-library
    outcome:
      Split code across modules, reason about imports, and select standard-library tools before adding
      dependencies.
    graduate_outcome_ids:
      - build-reproducibly
      - design-functions
    lesson_ids:
      - modules-and-standard-library.modules-and-packages
      - modules-and-standard-library.standard-library-fluency
    challenge_id: modules-and-standard-library.challenge
  - number: 17
    id: reproducible-projects
    outcome: Arrange source and tests, isolate dependencies, and describe a buildable project with pyproject.toml.
    graduate_outcome_ids:
      - build-reproducibly
    lesson_ids:
      - reproducible-projects.project-layout
      - reproducible-projects.environments-and-dependencies
      - reproducible-projects.packaging-with-pyproject
    challenge_id: reproducible-projects.challenge
  - number: 18
    id: git-and-collaboration
    outcome: Create meaningful commits, work safely with branches and merges, and collaborate through remotes.
    graduate_outcome_ids:
      - collaborate-with-git
    lesson_ids:
      - git-and-collaboration.repositories-and-commits
      - git-and-collaboration.branches-and-merges
      - git-and-collaboration.remotes-and-collaboration
    challenge_id: git-and-collaboration.challenge
  - number: 19
    id: command-line-applications
    outcome: Build commands with explicit arguments, standard streams, exit codes, and testable core behavior.
    graduate_outcome_ids:
      - operate-reliably
      - design-functions
    lesson_ids:
      - command-line-applications.command-line-programs
      - command-line-applications.streams-and-exit-codes
    challenge_id: command-line-applications.challenge
  - number: 20
    id: testing-with-pytest
    outcome:
      Turn contracts and boundaries into readable tests, then use failures, fixtures, and parametrization
      as design feedback.
    graduate_outcome_ids:
      - verify-quality
      - debug-from-evidence
    lesson_ids:
      - testing-with-pytest.testing-with-pytest
      - testing-with-pytest.test-design-and-failures
      - testing-with-pytest.fixtures-parametrization-and-boundaries
    challenge_id: testing-with-pytest.challenge
  - number: 21
    id: maintainable-code
    outcome: Improve code safely with documentation, refactoring, formatting, linting, and useful type information.
    graduate_outcome_ids:
      - verify-quality
    lesson_ids:
      - maintainable-code.style-formatting-and-linting
      - maintainable-code.type-checking
      - maintainable-code.documentation-and-refactoring
    challenge_id: maintainable-code.challenge
  - number: 22
    id: object-oriented-python
    outcome: Model cohesive state and behavior with classes and dataclasses while avoiding unnecessary abstraction.
    graduate_outcome_ids:
      - model-data
      - operate-reliably
    lesson_ids:
      - object-oriented-python.oop-basics
      - object-oriented-python.dataclasses
      - object-oriented-python.oop-design
    challenge_id: object-oriented-python.challenge
  - number: 23
    id: pythonic-iteration
    outcome:
      Choose comprehensions, generators, decorators, and context managers when they make intent and
      lifecycles clearer.
    graduate_outcome_ids:
      - operate-reliably
      - design-functions
    lesson_ids:
      - pythonic-iteration.comprehensions
      - pythonic-iteration.iterables-and-generators
      - pythonic-iteration.decorators
      - pythonic-iteration.context-managers
    challenge_id: pythonic-iteration.challenge
  - number: 24
    id: reliable-project-operations
    outcome:
      Combine configuration, logging, secrets, local quality gates, and CI into an observable project
      workflow.
    graduate_outcome_ids:
      - operate-reliably
      - verify-quality
      - build-reproducibly
    lesson_ids:
      - reliable-project-operations.logging-and-configuration
      - reliable-project-operations.pre-commit-and-ci
      - reliable-project-operations.project-operations-and-secrets
    challenge_id: reliable-project-operations.challenge
