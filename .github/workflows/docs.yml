name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_INSTALLER_PARALLEL: "false"
  VIRTUALENV_ACTIVATORS: "bash,python"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: conda.yaml
          channels: conda-forge,nodefaults
          activate-environment: fc-python
          auto-update-conda: true
          conda-solver: libmamba
          python-version: "3.13"

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry check
          poetry install --with dev --extras "dev"

      - name: Install PDF build dependencies
        run: |
          python -m pip install -r scripts/pdf/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core poppler-utils

      - name: Build website, notebooks, and PDF edition
        run: makim docs.build

      - name: Verify downloadable book
        run: python scripts/verify_course_pdf.py

      - name: Upload PDF edition for review
        uses: actions/upload-artifact@v4
        with:
          name: python-foundations-study-book
          path: docs/_site/downloads/
          if-no-files-found: error
          retention-days: 14

      - name: Publish to gh-pages branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/_site
          force_orphan: true
